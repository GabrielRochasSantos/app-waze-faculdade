spring.application.name=waze-backend
server.port=8081

# H2 Database (persistente em arquivo, auto-create)
spring.datasource.url=jdbc:h2:file:./data/waze;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true




# JWT Secret (mude para produção)
jwt.secret=italoNavSecretKeySuperSegura2024ChangeMe

# SMTP (para reset de senha com email real)
# Troque para seu provedor/credenciais (recomendado via variáveis de ambiente em produção)
spring.mail.host=smtp.seu-provedor.com
spring.mail.port=587
spring.mail.username=SEU_EMAIL
spring.mail.password=SUA_SENHA_APLICATIVO
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp

# Redis Cache (instale Redis local: choco install redis-ports)
spring.data.redis.host=localhost
spring.data.redis.port=6379


# CORS Full (frontend static)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

